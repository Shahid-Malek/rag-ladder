# Requires a pre-mounted, dedicated <=1 GiB persistent runtime filesystem.
# Configure the remote tunnel origin as http://app:8000; no host listener exists.
services:
  app:
    build:
      context: .
      target: app
      platforms: [linux/arm64]
    platform: linux/arm64
    env_file:
      - path: ${RAG_APP_ENV_FILE:?Set an absolute private app environment file outside this repo}
        required: true
    environment:
      HOSTED_MODE: "true"
      TRUSTED_PROXY_IPS: "172.30.0.2"
      MAX_CONCURRENT_INGESTS: "1"
      MAX_CONCURRENT_QUESTIONS: "2"
      # The launcher enforces exponential delay before each failed app restart.
      WATCHDOG_RESTART_BASE_SECONDS: "10"
      WATCHDOG_RESTART_MAX_SECONDS: "300"
    user: "10001:10001"
    group_add: ["10002"]
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: 1.5
    mem_limit: 6g
    memswap_limit: 6g
    pids_limit: 192
    shm_size: 16m
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,uid=10001,gid=10001,mode=700
    volumes:
      - type: bind
        source: ${RAG_RUNTIME_DIR:?Set the bounded persistent runtime mount path}
        target: /app/.cache/stage2
        bind:
          create_host_path: false
      - type: volume
        source: parser_ipc
        target: /run/parser-ipc
        read_only: true
    depends_on:
      parser:
        condition: service_healthy
    networks:
      ingress:
        ipv4_address: 172.30.0.3
      app_egress: {}
    restart: unless-stopped
    stop_grace_period: 20s
    logging: &logs
      driver: json-file
      options:
        max-size: "1m"
        max-file: "3"

  parser:
    build:
      context: .
      target: parser
      platforms: [linux/arm64]
    platform: linux/arm64
    network_mode: none
    environment:
      PARSER_RESTART_DELAY_SECONDS: "3"
    user: "10002:10002"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: 0.25
    mem_limit: 2g
    memswap_limit: 2g
    pids_limit: 64
    shm_size: 16m
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,uid=10002,gid=10002,mode=700
      - /app/.cache/parser:rw,noexec,nosuid,nodev,size=256m,uid=10002,gid=10002,mode=700
    volumes:
      - type: volume
        source: parser_ipc
        target: /run/parser-ipc
        read_only: false
    restart: unless-stopped
    stop_grace_period: 5s
    logging: *logs

  cloudflared:
    image: cloudflare/cloudflared:2026.10.7
    platform: linux/arm64
    command: [tunnel, --no-autoupdate, --metrics, "127.0.0.1:2000", run, --token-file, /run/secrets/tunnel_token]
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: 0.25
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 32
    shm_size: 16m
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,uid=65532,gid=65532,mode=700
    secrets: [tunnel_token]
    networks:
      ingress:
        ipv4_address: 172.30.0.2
      tunnel_egress: {}
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: [CMD, cloudflared, tunnel, --metrics, "127.0.0.1:2000", ready]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    logging: *logs

networks:
  ingress:
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/29
  app_egress: {}
  tunnel_egress: {}

secrets:
  tunnel_token:
    file: ${RAG_TUNNEL_TOKEN_FILE:?Set an absolute private token file outside this repo}

# Socket inode only: parser owns directory 0750/socket 0660; app joins GID10002.
# App mount is read-only and never used for code/config; parser has no app-data mount.
volumes:
  parser_ipc:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=1m,mode=0750,uid=10002,gid=10002,nodev,nosuid,noexec"
